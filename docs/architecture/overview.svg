<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">One-Tick runtime architecture</title>
  <desc id="desc">Browser to Nginx; Nginx routes pages to Next.js and API/WebSocket traffic to FastAPI; FastAPI uses PostgreSQL, AI providers, and OSS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .bg{fill:#0b1220}.panel{fill:#111c2e;stroke:#334155;stroke-width:1.5}.accent{fill:#132a2e;stroke:#22d3ee;stroke-width:2}
      .db{fill:#1d1733;stroke:#a78bfa;stroke-width:2}.ext{fill:#231d12;stroke:#f59e0b;stroke-width:1.5}.msg{fill:#25190f;stroke:#fb923c;stroke-width:1.5}
      .title{font:700 28px sans-serif;fill:#f8fafc}.head{font:700 16px sans-serif;fill:#f8fafc}.body{font:13px sans-serif;fill:#cbd5e1;fill-opacity:.9}
      .edge{stroke:#67e8f9;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
      .label{font:12px sans-serif;fill:#94a3b8}
    </style>
  </defs>
  <rect class="bg" width="1200" height="700" rx="18"/>
  <text class="title" x="42" y="52">One-Tick 运行时架构</text>
  <rect class="panel" x="40" y="275" width="160" height="86" rx="12"/>
  <text class="head" x="62" y="308">学习者浏览器</text><text class="body" x="62" y="334">React UI / WSS</text>
  <rect class="ext" x="260" y="270" width="170" height="96" rx="12"/>
  <text class="head" x="282" y="304">Nginx 同域网关</text><text class="body" x="282" y="330">:80 · 同域反代</text>
  <rect class="panel" x="500" y="92" width="205" height="96" rx="12"/>
  <text class="head" x="522" y="126">Next.js Web App</text><text class="body" x="522" y="152">App Router / React 19</text>
  <rect class="accent" x="500" y="270" width="205" height="102" rx="12"/>
  <text class="head" x="522" y="304">FastAPI 核心 API</text><text class="body" x="522" y="330">REST :8001 / JWT</text>
  <rect class="msg" x="800" y="218" width="205" height="92" rx="12"/>
  <text class="head" x="822" y="252">WebSocket 聊天室</text><text class="body" x="822" y="278">心跳 / 限流 / 广播</text>
  <rect class="accent" x="800" y="76" width="205" height="100" rx="12"/>
  <text class="head" x="822" y="110">AI 编排层</text><text class="body" x="822" y="136">Agent / RAG / Memory / Tools</text>
  <rect class="db" x="800" y="390" width="205" height="100" rx="12"/>
  <text class="head" x="822" y="424">PostgreSQL + pgvector</text><text class="body" x="822" y="450">业务数据 + 向量索引</text>
  <rect class="ext" x="1025" y="76" width="140" height="100" rx="12"/>
  <text class="head" x="1045" y="110">AI 模型服务</text><text class="body" x="1045" y="136">自动降级</text>
  <rect class="ext" x="260" y="500" width="170" height="90" rx="12"/>
  <text class="head" x="282" y="534">阿里云 OSS</text><text class="body" x="282" y="560">预签名直传</text>
  <path class="edge" d="M200 318 H260"/><text class="label" x="208" y="307">HTTPS</text>
  <path class="edge" d="M430 300 H500 V140"/><text class="label" x="445" y="250">页面 / 静态资源</text>
  <path class="edge" d="M430 335 H500 V320"/><text class="label" x="442" y="326">/api/*</text>
  <path class="dash" d="M705 320 H800 V264"/><text class="label" x="730" y="310">/ws</text>
  <path class="dash" d="M705 140 H800 V126"/><text class="label" x="735" y="132">AI 请求</text>
  <path class="dash" d="M902 310 V170"/><text class="label" x="915" y="235">角色消息</text>
  <path class="edge" d="M705 355 H800 V440"/><text class="label" x="720" y="420">SQLAlchemy</text>
  <path class="dash" d="M1005 150 V218 M902 390 V170"/><text class="label" x="1018" y="190">Chat / Embedding</text>
  <path class="dash" d="M575 372 V500 H430"/><text class="label" x="470" y="490">上传凭证 / 直传</text>
  <text class="body" x="42" y="655">详细交互版本见 overview.html；源文件见 overview.json。</text>
</svg>