# ============================================================
# nginx 反代（同域架构）：
#   /api/* 与 /ws → FastAPI 后端（app:8001）
#   其余（页面/静态资源）→ Next.js 前端（web:3000）
# ============================================================
server {
    listen 80;
    server_name _;

    # 知识库上传 docx/pdf 等文件，放宽 body 上限
    client_max_body_size 20m;

    # 后端健康检查（FastAPI，不走前端守卫）
    location = /health {
        proxy_pass http://app:8001;
        proxy_set_header Host $host;
    }

    # ---- WebSocket 聊天室（必须带 Upgrade / Connection 头）----
    location /ws {
        proxy_pass http://app:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接：聊天室心跳 30s，读超时放宽
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- REST API（全部走 FastAPI；流式响应不缓冲，边生成边转发）----
    location /api/ {
        proxy_pass http://app:8001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        # AI 流式回复：Agent 可能先跑多轮工具调用，首字节前的空档可能远超默认 60s，
        # 不设会让 nginx 提前断开上游，前端报 ERR_INCOMPLETE_CHUNKED_ENCODING
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 页面与静态资源（Next.js）----
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        # 用 $http_host 保留端口（8080 等非标准端口时 Next.js Server Actions
        # 会校验 x-forwarded-host 与浏览器 origin 一致；$host 会丢端口导致 500）
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
